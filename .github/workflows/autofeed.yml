name: Autopilot AI News Feeder

on:
  schedule:
    # ⏱️ Otomatis berjalan setiap 5 jam sekali
    - cron: "0 */5 * * *"
  workflow_dispatch:

jobs:
  run-autofeed:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python Version
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Required Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin google-genai feedparser python-dotenv

      - name: 🚀 Run AI Autopilot Feeder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}
        run: |
          python autofeed.py
